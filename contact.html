<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap"><link rel="stylesheet" href="css/style.css"><title>Contact us | Chaise Longue</title><meta name="description" content="Book an intro call with Chaise Longue."></head>
<body data-page="contact"><header class="menu" id="menu"></header>
<main class="cwrap"><h1>Book an intro call</h1><p>Tell us what you need. It lands straight in our mailbox.</p>
<form id="f"><label for="n">Name</label><input id="n" name="name" required>
<label for="b">Brand or company</label><input id="b" name="brand">
<label for="e">Email</label><input id="e" name="email" type="email" required>
<label for="w">What you need</label><select id="w" name="need"><option>Retainer films</option><option>Hero films</option><option>Agency servicing</option><option>Not sure</option></select>
<label for="m">Message</label><textarea id="m" name="message"></textarea>
<input class="hp" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="go" type="submit">Send</button>
<div class="ok" id="ok">Thank you. We will get back to you soon.</div><div class="err" id="err">Something went wrong. Please write to us directly below.</div></form>
<div class="direct">Or write to us directly: <a id="mail" href="#"></a></div></main>
<script src="js/content.js"></script><script src="js/main.js"></script></body></html>
